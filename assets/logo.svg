<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="460" height="360">
  <!-- Background propeller wheels -->
  <g fill="none" stroke="#e0d8f0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Front wheel -->
    <circle cx="230" cy="300" r="80"/>
    <path d="M150 220 Q100 180, 120 140 L180 120 L210 160 Z" fill="#f0e8f8"/>
    <!-- Rear wheel -->
    <circle cx="230" cy="300" r="60"/>
    <path d="M310 220 Q360 180, 380 140 L320 120 L290 160 Z" fill="#f0e8f8"/>
  </g>
  <!-- Double interlocked G -->
  <g>
    <!-- Left G (mirrored black) -->
    <text x="230" y="190" font-family="'Arial Black', Impact, sans-serif" font-size="200" font-weight="900" fill="black" text-anchor="middle" transform="scale(-1,1) translate(-460,0)" letter-spacing="-25">G</text>
    <!-- Right G -->
    <text x="230" y="190" font-family="'Arial Black', Impact, sans-serif" font-size="200" font-weight="900" fill="black" text-anchor="middle" letter-spacing="-25">G</text>
    <!-- White gap between them -->
    <path d="M280 130 C 300 130 320 150 310 170 C 300 190 280 210 260 190" stroke="white" stroke-width="12" fill="none" opacity="0.9"/>
  </g>
  <!-- FORCE text -->
  <g font-family="'Courier New', monospace" font-weight="700" text-anchor="middle">
    <text x="230" y="330" font-size="44" fill="none" stroke="#9b59b6" stroke-width="1.5">FORCE</text>
    <text x="230" y="330" font-size="44" fill="none" stroke="#9b59b6" stroke-width="0.4" opacity="0.5">FORCE</text>
  </g>
</svg>