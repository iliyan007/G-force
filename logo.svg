<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" width="520" height="430">
  <!-- Three-blade propeller (outlined, white fill for blade separation) -->
  <g fill="#ffffff" stroke="#0b0b0b" stroke-width="4" stroke-linejoin="round">
    <path d="M260 34 C 304 96 296 180 260 212 C 224 180 216 96 260 34 Z"/>
    <path d="M260 34 C 304 96 296 180 260 212 C 224 180 216 96 260 34 Z" transform="rotate(120 260 212)"/>
    <path d="M260 34 C 304 96 296 180 260 212 C 224 180 216 96 260 34 Z" transform="rotate(240 260 212)"/>
  </g>
  <!-- Interlocked G-G mark (white halo creates the gap against the blades) -->
  <g font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="184" font-weight="900" fill="#0b0b0b" stroke="#ffffff" stroke-width="14" paint-order="stroke" text-anchor="middle">
    <text transform="translate(132,258) scale(-1,1)">G</text>
    <text transform="translate(388,258)">G</text>
  </g>
  <!-- FORCE wordmark -->
  <text x="260" y="368" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="500" letter-spacing="16" fill="#0b0b0b" stroke="#ffffff" stroke-width="10" paint-order="stroke">FORCE</text>
</svg>
