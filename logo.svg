<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" width="520" height="430">
  <style>
    .prop-blade { fill: #ffffff; stroke: #0b0b0b; stroke-width: 4; stroke-linejoin: round; }
    .g-mark { font-family: 'Arial Black', -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 184px; font-weight: 900; fill: #0b0b0b; stroke: #ffffff; stroke-width: 14px; paint-order: stroke; text-anchor: middle; }
    .word-force { font-family: 'JetBrains Mono', 'Helvetica Neue', Arial, sans-serif; font-size: 46px; font-weight: 600; letter-spacing: 16px; fill: #0b0b0b; stroke: #ffffff; stroke-width: 10px; paint-order: stroke; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .prop-blade { fill: #1a1d22; stroke: #f4f6f8; }
      .g-mark { fill: #f4f6f8; stroke: #0d0f12; }
      .word-force { fill: #f4f6f8; stroke: #0d0f12; }
    }
  </style>
  <!-- Three-blade propeller -->
  <g class="prop-blade">
    <path d="M260 34 C 304 96 296 180 260 212 C 224 180 216 96 260 34 Z"/>
    <path d="M260 34 C 304 96 296 180 260 212 C 224 180 216 96 260 34 Z" transform="rotate(120 260 212)"/>
    <path d="M260 34 C 304 96 296 180 260 212 C 224 180 216 96 260 34 Z" transform="rotate(240 260 212)"/>
  </g>
  <!-- Interlocked G-G mark -->
  <g class="g-mark">
    <text transform="translate(132,258) scale(-1,1)">G</text>
    <text transform="translate(388,258)">G</text>
  </g>
  <!-- FORCE wordmark -->
  <text x="260" y="368" class="word-force">FORCE</text>
</svg>
